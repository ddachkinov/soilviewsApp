version: '3.8'

# SoilViews Development Environment
# Includes: PostgreSQL + PostGIS, Redis, MinIO (S3), Unleash

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: soilviews-postgres
    environment:
      POSTGRES_DB: soilviews
      POSTGRES_USER: soilviews
      POSTGRES_PASSWORD: soilviews_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soilviews']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soilviews-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: soilviews-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO client to create default bucket
  minio-setup:
    image: minio/mc:latest
    container_name: soilviews-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb myminio/soilviews-cogs --ignore-existing;
      mc policy set download myminio/soilviews-cogs;
      echo 'MinIO bucket created: soilviews-cogs';
      "

  unleash:
    image: unleashorg/unleash-server:5.7
    container_name: soilviews-unleash
    environment:
      DATABASE_URL: postgres://unleash:unleash@postgres:5432/unleash
      DATABASE_SSL: 'false'
      INIT_ADMIN_API_TOKENS: 'admin-token:dev.secret'
      UNLEASH_URL: http://localhost:4242
    ports:
      - '4242:4242'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4242/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: soilviews-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@soilviews.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: soilviews-network
